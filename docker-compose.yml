services:
  postgres:
    image: postgres:16-alpine
    container_name: peblonotes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: peblo
      POSTGRES_PASSWORD: peblo_password
      POSTGRES_DB: peblonotes
    ports:
      - "5432:5432"
    volumes:
      - peblonotes_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peblo -d peblonotes"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  peblonotes_pgdata:
